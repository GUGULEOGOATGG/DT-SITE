# Gera o instalador do Windows automaticamente.
# - Toda vez que você clicar em "Run workflow" na aba Actions, ou
# - quando criar uma versão (tag v1.0.1, v1.1.0…), o instalador vira um "Release" para download.
name: Instalador Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Controle-de-Estoque-Windows
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 30
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
