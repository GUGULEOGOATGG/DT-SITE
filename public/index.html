<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de Estoque</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Tela de login -->
  <section id="tela-login" class="login" hidden>
    <form id="form-login" class="cartao login-cartao">
      <div class="marca"><span class="logo">⚡</span> Controle de Estoque</div>
      <p class="sub">Elétrica · Hidráulica · Segurança Eletrônica</p>
      <label>E-mail<input name="email" type="email" required autocomplete="username"></label>
      <label>Senha<input name="senha" type="password" required autocomplete="current-password"></label>
      <button class="btn primario" type="submit">Entrar</button>
      <p class="erro" id="erro-login"></p>
    </form>
  </section>

  <!-- Aplicação -->
  <div id="app" hidden>
    <header class="topo">
      <button class="btn icone" id="btn-menu" aria-label="Menu">☰</button>
      <div class="marca"><span class="logo">⚡</span> Estoque</div>
      <div class="usuario"><span id="nome-usuario"></span>
        <button class="btn fantasma" id="btn-senha">Senha</button>
        <button class="btn fantasma" id="btn-sair">Sair</button>
      </div>
    </header>
    <nav class="menu" id="menu">
      <a href="#painel">📊 Painel</a>
      <a href="#produtos">📦 Produtos</a>
      <a href="#movimentar">🔄 Entrada / Saída</a>
      <a href="#historico">🕘 Histórico</a>
      <a href="#categorias">🏷️ Categorias</a>
      <a href="#fornecedores">🚚 Fornecedores</a>
      <a href="#relatorios">📄 Relatórios</a>
      <a href="#usuarios" class="so-admin">👤 Usuários</a>
    </nav>
    <main id="conteudo"></main>
  </div>

  <dialog id="modal"><form method="dialog" id="modal-form" class="modal-corpo"></form></dialog>
  <div id="aviso" class="aviso" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
