<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de Estoque</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login -->
  <section id="tela-login" class="login" hidden>
    <div class="login-marca">
      <div class="login-marca-conteudo">
        <img src="icon.png" alt="" class="login-icone">
        <h1>Controle de Estoque</h1>
        <p>Tudo o que entra e sai da loja, organizado num só lugar.</p>
        <ul class="login-setores">
          <li><span class="ponto eletrica"></span>Elétrica</li>
          <li><span class="ponto hidraulica"></span>Hidráulica</li>
          <li><span class="ponto seguranca"></span>Segurança Eletrônica</li>
        </ul>
      </div>
    </div>
    <div class="login-form-lado">
      <form id="form-login" class="login-form">
        <h2>Bem-vindo de volta</h2>
        <p class="suave">Entre com seu e-mail e senha para continuar.</p>
        <label class="campo">E-mail<input name="email" type="email" required autocomplete="username" placeholder="voce@loja.com"></label>
        <label class="campo">Senha<input name="senha" type="password" required autocomplete="current-password" placeholder="••••••••"></label>
        <button class="btn primario grande" type="submit">Entrar</button>
        <p class="erro" id="erro-login"></p>
      </form>
    </div>
  </section>

  <!-- Aplicação -->
  <div id="app" hidden>
    <aside class="lateral" id="lateral">
      <div class="lateral-marca">
        <img src="icon.png" alt="">
        <div><strong>Estoque</strong><small>Gestão da loja</small></div>
      </div>
      <nav class="lateral-nav" id="menu"></nav>
      <div class="lateral-usuario">
        <div class="avatar" id="avatar"></div>
        <div class="lateral-usuario-info"><strong id="nome-usuario"></strong><small id="perfil-usuario"></small></div>
        <button class="btn-icone claro" id="btn-senha" title="Alterar senha"></button>
        <button class="btn-icone claro" id="btn-sair" title="Sair"></button>
      </div>
    </aside>
    <div class="fundo-lateral" id="fundo-lateral"></div>
    <div class="area">
      <header class="topo-movel">
        <button class="btn-icone" id="btn-menu" aria-label="Abrir menu"></button>
        <strong>Estoque</strong>
      </header>
      <main id="conteudo"></main>
    </div>
  </div>

  <dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>
  <div id="avisos" class="avisos" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
